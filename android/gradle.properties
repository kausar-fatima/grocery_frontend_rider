# -Djdk.net.unixdomain.tmpdir points the JVM's NIO selector pipe at a
# space-free path. The default temp dir contains a space ("kausar fatima"),
# which makes the AF_UNIX socket connect fail ("Unable to establish loopback
# connection") and breaks every Gradle build on this machine.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:/Temp
android.useAndroidX=true
